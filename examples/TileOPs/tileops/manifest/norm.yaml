# norm.yaml -- manifest entries for the 'norm' family (NPU benchmark).
#
# Standalone spec; no dependency on the TileOPs repository.
# Ported from TileOPs ``tileops/manifest/normalization.yaml`` --
# AdaLayerNormFwdOp entry only (the neighbouring AdaLayerNormZeroFwdOp and
# the other norm entries are not migrated yet).
#
# Note: the GPU repo names the manifest file ``normalization.yaml`` while its
# ops/kernels family directory is ``norm``; the NPU project keeps one name
# (``norm``) for the manifest file, workload module, and package directories.
# See docs/gpu_to_npu_adaptation.md for the GPU-to-NPU adaptation notes.

AdaLayerNormFwdOp:
  ref_api: "none"
  family: norm
  status: implemented

  signature:
    inputs:
      x: {dtype: "float32 | float16 | bfloat16"}
      scale: {dtype: "same_as(x)"}
      shift: {dtype: "same_as(x)"}
    outputs:
      output: {dtype: "same_as(x)"}
    params:
      eps: {type: float, default: 1.0e-5}
    shape_rules:
      - "scale.shape == x.shape"
      - "shift.shape == x.shape"
      - "output.shape == x.shape"

  workloads:
    # Smoke: small DiT-style block (all three dtypes)
    - {x_shape: [64, 1152], dtypes: [float32, float16, bfloat16], label: "smoke-dit"}
    # Full: DiT-XL/2 (hidden_dim=1152)
    - {x_shape: [1024, 1152], dtypes: [float16, bfloat16], label: "dit-xl-2"}
    # Full: Llama-3.1-8B prefill (hidden_dim=4096)
    - {x_shape: [2048, 4096], dtypes: [float16, bfloat16], label: "llama-3.1-8b-prefill"}
    # Full: Llama-3.1-8B decode
    - {x_shape: [1, 4096], dtypes: [bfloat16], label: "llama-3.1-8b-decode"}

  roofline:
    vars:
      M: "product(x.shape[:-1])"
      N: "x.shape[-1]"
    # Per row: N mean + N variance + N normalize + N scale + N shift ≈ 5N
    flops: "5 * M * N"
    # Read x + read scale + read shift + write output = 4*M*N
    bytes: "4 * M * N * elem_bytes"

  source:
    kernel: tileops/kernels/norm/ada_layer_norm/ada_layer_norm.py
    kernel_map:
      ada_layer_norm: AdaLayerNormKernel
    op: tileops/ops/norm/ada_layer_norm.py
    test: tests/ops/test_ada_layer_norm.py
    bench: benchmarks/ops/bench_ada_layer_norm.py
    bench_manifest_driven: true

# ---------------------------------------------------------------------------
# GroupNormFwdOp -- affine primary.
#
# Ported from TileOPs ``tileops/manifest/normalization.yaml``: the affine
# ``GroupNormFwdOp`` entry only.  The ``GroupNormNoAffineFwdOp`` sibling
# (``variant_of: GroupNormFwdOp``) and the other norm entries are not
# migrated.  Note the family is ``norm`` here (the GPU manifest file is
# ``normalization.yaml`` with ``family: normalization``).
#
# Affine layering: ``weight``/``bias`` are per-channel ``(C,)`` at the Op
# layer; the kernel applies a row-broadcast ``(D_padded,)`` affine and the
# Op applies the per-channel scale/shift outside the kernel.
# ---------------------------------------------------------------------------
GroupNormFwdOp:
  ref_api: "torch.nn.functional.group_norm"
  family: norm
  status: implemented

  signature:
    inputs:
      x: {dtype: "float32 | float16 | bfloat16"}
      weight: {dtype: "same_as(x)"}
      bias: {dtype: "same_as(x)"}
    outputs:
      output: {dtype: "same_as(x)"}
    params:
      num_groups: {type: int}
      eps: {type: float, default: 1.0e-5}
    shape_rules:
      - "weight.shape == (x.shape[1],)"
      - "bias.shape == (x.shape[1],)"
      - "x.shape[1] % num_groups == 0"
      - "output.shape == x.shape"

  workloads:
    # Smoke: small CI-friendly shape (all three dtypes)
    - {x_shape: [2, 32, 8, 8], num_groups: 8, dtypes: [float32, float16, bfloat16], label: "smoke-g8"}
    # Full: typical CV shapes
    - {x_shape: [8, 128, 32, 32], num_groups: 32, dtypes: [float16, bfloat16], label: "image-g32"}
    - {x_shape: [4, 256, 28, 28], num_groups: 32, dtypes: [float16], label: "wider-channel-g32"}
    - {x_shape: [4, 128, 30, 30], num_groups: 16, dtypes: [float16], label: "tail-spatial-g16"}

  roofline:
    vars:
      N: "x.shape[0]"
      C: "x.shape[1]"
      spatial_size: "product(x.shape[2:])"
    # Per element: subtract mean + square for var + normalize + scale + bias ≈ 5
    flops: "5 * N * C * spatial_size"
    # Read x + write output + read weight (C) + read bias (C)
    bytes: "(2 * N * C * spatial_size + 2 * C) * elem_bytes"

  source:
    kernel: tileops/kernels/norm/group_norm/group_norm.py
    kernel_map:
      group_norm: GroupNormKernel
    op: tileops/ops/norm/group_norm.py
    test: tests/ops/test_group_norm.py
    bench: benchmarks/ops/bench_group_norm.py
    bench_manifest_driven: true
